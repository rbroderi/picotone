[package]
name = "picotone-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "WebAssembly build of the picotone decoder for browsers"
license = "GPL-3.0-or-later"
publish = false

# Its own workspace, so it never joins (or builds into) the parent crate's.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
default = []
# Web Worker thread pool via wasm-bindgen-rayon (nightly, atomics, build-std).
threads = ["dep:wasm-bindgen-rayon"]
# Fused multiply-add from relaxed SIMD, for builds with `+relaxed-simd`. Such a
# module only loads in browsers that have relaxed SIMD.
relaxed-simd = ["picotone/relaxed-simd"]

[dependencies]
anyhow = "1.0.104"
picotone = { path = "..", default-features = false }
rayon = "1.12.0"
serde_json = "1.0.154"
wasm-bindgen = "=0.2.130"
wasm-bindgen-rayon = { version = "1.3.0", features = ["no-bundler"], optional = true }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "debuginfo"

# The network is unusably slow unoptimised, even in native tests.
[profile.dev.package."*"]
opt-level = 3

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_results = "deny"
unused_lifetimes = "deny"
unused_import_braces = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
let_underscore_drop = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
warnings = { level = "deny", priority = -2 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
expect_used = "deny"
get_unwrap = "deny"
panic = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
use_debug = "deny"
