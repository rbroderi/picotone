[project]
name = "picotone-tools"
version = "0.1.0"
description = "Table builder and measurement scripts of picotone's cx2 entropy coder"
requires-python = ">=3.12"
# torch is used for CPU linear algebra (SVD) by the table builder and for scoring Meta's LM.
dependencies = ["numpy==2.5.4", "torch==2.15.0"]

[project.optional-dependencies]
# Only for parity.py, the encoder and decoder check against Hugging Face's EncodecModel.
parity = ["transformers==5.3.0"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
